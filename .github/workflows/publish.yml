# .github/workflows/publish.yml
#
# Stages the package on npm through trusted publishing: npm accepts the
# short-lived OIDC identity of this workflow instead of a stored token, so
# there is no publish secret in the repository to leak.
#
# The workflow can only stage. A staged version stays invisible until a
# maintainer approves it on npmjs.com (Staged Packages) or with
# `npm stage approve <stage-id>`, both behind two-factor authentication, so
# a compromised workflow cannot put a release in front of users. The trusted
# publisher on npm allows `npm stage publish` alone; `npm publish` from here
# is rejected.
#
# A pushed version tag is the release decision. package.json carries the
# number, and the job refuses when the tag and the number disagree, so a
# tag can never stage a version other than the one it names.

name: Stage on npm

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  id-token: write # required for the npm trusted-publishing OIDC exchange

jobs:
  # The repository's dependency audit (audit.yml): a version is staged only
  # while every release this repository pins is current or declared, and the
  # tree a consumer installs carries no undeclared advisory.
  audit:
    uses: ./.github/workflows/audit.yml

  publish:
    needs: [audit]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false # a release build never reuses a cache

      - name: Tag matches package.json version
        run: |
          expected="v$(node -p "require('./package.json').version")"
          if [ "$GITHUB_REF_NAME" != "$expected" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package.json version $expected" >&2
            exit 1
          fi

      - run: npm ci
      - run: npm run build
      - run: npm stage publish # needs npm 11.15.0 or later
