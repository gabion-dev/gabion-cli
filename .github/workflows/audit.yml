# .github/workflows/audit.yml
#
# The advisory audit of this repository (the gabion-audit package): the npm
# tree consumers install, against the known advisories. Only what is
# undeclared fails — an advisory kept on purpose is declared in
# gabion-audit.json with its reason and the event that ends it, and a
# declaration npm audit no longer reports fails as well.
#
# Runs by the button, and from the release workflow before it publishes, so
# a release goes out without a known advisory or with every advisory
# declared. It does not run on push: an advisory appears with what others
# publish, not with this repository's commits. Whether a dependency is
# current is Renovate's work (renovate.json5), not this audit's.
#
# The package has no runtime dependencies, so lifting the release-age
# cooldown of .npmrc for this one npx admits nothing but the audit itself,
# which the organisation publishes; without the lift, an audit released
# this week could not be installed for seven days. Renovate updates the
# version below.

name: Audit

on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Audit
        env:
          npm_config_min_release_age: "0"
        run: npx --yes gabion-audit@0.2.0
